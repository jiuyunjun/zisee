[versions]
# 1.56 demands Play Services for AR 1.56 (min_apk_version 261960000), which the store does not
# distribute yet; devices on 1.54 would be told to update to a version they cannot obtain.
arcore = "1.54.0"
camerax = "1.5.1"
agp = "8.9.1"
kotlin = "2.0.21"
compose-bom = "2024.09.00"
activity = "1.9.3"
lifecycle = "2.8.6"
datastore = "1.0.0"
coroutines = "1.9.0"
junit = "4.13.2"
okhttp = "4.12.0"
webrtc = "144.7559.15"
zxing = "3.5.3"
google-services = "4.4.2"
firebase-bom = "33.7.0"

[libraries]
mlkit-face = { module = "com.google.mlkit:face-detection", version = "16.1.7" }
arcore = { module = "com.google.ar:core", version.ref = "arcore" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
webrtc = { module = "io.github.webrtc-sdk:android", version.ref = "webrtc" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
junit = { module = "junit:junit", version.ref = "junit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
zxing = { module = "com.google.zxing:core", version.ref = "zxing" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
json-test = { module = "org.json:json", version = "20240303" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
