<!doctype html>

<div style="width: 390px; height: 844px; background: #0B0F12; color: #E8EDF0; overflow: hidden; display: flex; flex-direction: column; padding: 56px 20px 34px 20px; box-sizing: border-box;">

  <div style="display: flex; align-items: center; gap: 14px;">

  </div>

  <div style="height: 30px;"></div>

  <div style="display: flex; align-items: center; gap: 16px; padding: 20px; background: #12181D; border-radius: 24px;">

      </div>
    </div>
  </div>

  <div style="height: 10px;"></div>

  <div style="background: #12181D; border-radius: 24px; padding: 4px 16px;">
    <div style="padding: 18px 0; display: flex; align-items: center; gap: 16px;">
      <div style="font-size: 15px; color: #E8EDF0; flex-grow: 1;">修改姓名</div>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4E5C65" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M9 5l7 7-7 7"></path></svg>
    </div>
    <div style="height: 1px; background: rgba(232,237,240,0.06);"></div>

      <div style="font-size: 15px; color: #E8EDF0; flex-grow: 1;">我的邀请</div>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4E5C65" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M9 5l7 7-7 7"></path></svg>
    </div>
  </div>

  <div style="height: 26px;"></div>

  <div style="padding: 22px 20px; background: #12181D; border-radius: 24px; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; align-items: flex-start; gap: 14px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5FD4D6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;"><path d="M20.5 12a8.5 8.5 0 1 1-2.9-6.4"></path><path d="M20.5 4.5v5h-5"></path></svg>

      </div>
    </div>
    <div style="height: 54px; border-radius: 27px; background: #5FD4D6; color: #071518; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500;">绑定账户</div>

  <div style="background: #12181D; border-radius: 24px; padding: 18px 20px; display: flex; align-items: center; gap: 16px;">

</div>
