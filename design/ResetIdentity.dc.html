<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Roboto','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #5FD4D6; } a:hover { color: #8AE3E4; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0B0F12; color: #E8EDF0; overflow: hidden; position: relative;">

  <div style="padding: 56px 20px 34px 20px; box-sizing: border-box; display: flex; flex-direction: column; opacity: 0.4;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E8EDF0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      <div style="font-size: 22px; font-weight: 500;">账户</div>
    </div>
    <div style="height: 30px;"></div>
    <div style="display: flex; align-items: center; gap: 16px; padding: 20px; background: #12181D; border-radius: 24px;">
      <div style="width: 60px; height: 60px; border-radius: 30px; background: #1E2A31; color: #C4D0D6; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 500; flex-shrink: 0;">九</div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 19px; font-weight: 500;">九云</div>
        <div style="font-size: 12px; color: #98A6AE;">仅此设备</div>
      </div>
    </div>
    <div style="height: 10px;"></div>
    <div style="background: #12181D; border-radius: 24px; padding: 18px 16px; font-size: 15px; color: #E8EDF0;">修改姓名</div>
  </div>

  <div style="position: absolute; top: 0; left: 0; width: 390px; height: 844px; background: rgba(6,9,11,0.62);"></div>

  <div style="position: absolute; left: 0; bottom: 0; width: 390px; background: #1A2228; border-radius: 30px 30px 0 0; padding: 14px 24px 34px 24px; box-sizing: border-box; display: flex; flex-direction: column; align-items: stretch;">

    <div style="display: flex; justify-content: center; padding-bottom: 22px;">
      <span style="width: 40px; height: 4px; border-radius: 2px; background: rgba(232,237,240,0.16); display: block;"></span>
    </div>

    <div style="width: 52px; height: 52px; border-radius: 26px; background: rgba(229,72,77,0.14); display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E5484D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5 2.5 20h19z"></path><path d="M12 10v4.5"></path><circle cx="12" cy="17.6" r="1.1" fill="#E5484D"></circle></svg>
    </div>

    <div style="height: 20px;"></div>

    <div style="font-size: 22px; font-weight: 500; letter-spacing: -0.2px;">重置身份？</div>

    <div style="height: 14px;"></div>

    <div style="font-size: 14.5px; line-height: 1.7; color: #98A6AE;">这会创建一个全新的 Zisee 身份。当前身份还没有绑定账户，重置后<span style="color: #E8EDF0;">可能无法恢复</span>。</div>

    <div style="height: 18px;"></div>

    <div style="display: flex; flex-direction: column; gap: 12px; padding: 18px 18px; background: rgba(232,237,240,0.05); border-radius: 20px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#E5484D" stroke-width="2.2" stroke-linecap="round" style="flex-shrink: 0;"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        <span style="font-size: 13.5px; color: #C4D0D6;">联系人与通话记录不会带到新身份</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#E5484D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        <span style="font-size: 13.5px; color: #C4D0D6;">对方保存的旧联系人会失效</span>
      </div>
    </div>

    <div style="height: 26px;"></div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="height: 56px; border-radius: 28px; background: #E5484D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500;">重置身份</div>
      <div style="height: 56px; border-radius: 28px; background: rgba(232,237,240,0.08); color: #E8EDF0; display: flex; align-items: center; justify-content: center; font-size: 16px;">取消</div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
