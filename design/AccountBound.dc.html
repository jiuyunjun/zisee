  <div style="height: 10px;"></div>

  <div style="background: #12181D; border-radius: 24px; padding: 4px 16px;">

      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4E5C65" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M9 5l7 7-7 7"></path></svg>

    </div>

    <div style="height: 1px; background: rgba(232,237,240,0.06);"></div>

    <div style="padding: 16px 0; display: flex; align-items: center; gap: 14px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#98A6AE" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect x="3" y="4" width="18" height="14" rx="2.6"></rect><path d="M11 21h2"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1;">
        <div style="font-size: 15px; color: #E8EDF0;">Tab S9</div>
        <div style="font-size: 12.5px; color: #67757E;">最近使用 · 上个月</div>
