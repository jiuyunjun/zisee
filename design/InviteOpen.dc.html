<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Roboto','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #5FD4D6; } a:hover { color: #8AE3E4; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0B0F12; color: #E8EDF0; overflow: hidden; display: flex; flex-direction: column; padding: 56px 20px 34px 20px; box-sizing: border-box; position: relative;">

  <svg width="390" height="440" viewBox="0 0 390 440" style="position: absolute; top: 0; left: 0;">
    <defs>
      <radialGradient id="ioGlow" cx="50%" cy="34%" r="60%">
        <stop offset="0%" stop-color="#5FD4D6" stop-opacity="0.10"></stop>
        <stop offset="100%" stop-color="#5FD4D6" stop-opacity="0"></stop>
      </radialGradient>
    </defs>
    <rect width="390" height="440" fill="url(#ioGlow)"></rect>
  </svg>

  <div style="display: flex; align-items: center; gap: 14px; position: relative;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E8EDF0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
  </div>

  <div style="height: 82px;"></div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 22px; position: relative;">
    <div style="width: 108px; height: 108px; border-radius: 54px; background: #1E2A31; color: #C4D0D6; display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 500;">九</div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <div style="font-size: 27px; font-weight: 500; letter-spacing: -0.3px;">九云</div>
      <div style="font-size: 15px; color: #98A6AE;">邀请你开始 Zisee 通话</div>
    </div>
  </div>

  <div style="height: 46px;"></div>

  <div style="display: flex; flex-direction: column; gap: 12px; position: relative;">
    <div style="height: 62px; border-radius: 26px; background: #5FD4D6; color: #071518; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 500;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#071518" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 10.2 21.5 6.8v10.4l-6-3.4z"></path><rect x="2.5" y="5.4" width="13" height="13.2" rx="3.2"></rect></svg>
      <span>开始通话</span>
    </div>
    <div style="height: 56px; border-radius: 26px; border: 1px solid rgba(232,237,240,0.13); display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 15px; color: #C4D0D6;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C4D0D6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8.5" r="4"></circle><path d="M3 20c0-3.6 3.1-6 7-6 1.5 0 2.9.35 4 .96"></path><path d="M18 14v6M15 17h6"></path></svg>
      <span>添加到联系人</span>
    </div>
  </div>

  <div style="height: 26px;"></div>

  <div style="display: flex; justify-content: center; position: relative;">
    <div style="font-size: 14px; color: #67757E; padding: 12px 20px;">以后再说</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px; border-radius: 20px; background: #12181D; position: relative;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#67757E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5.5"></path><circle cx="12" cy="7.8" r="1.1" fill="#67757E"></circle></svg>
    <div style="font-size: 12.5px; line-height: 1.65; color: #98A6AE;">添加到联系人后，即使这个邀请链接失效，你们仍然能互相呼叫。</div>
  </div>

</div>
</x-dc>
</body>
</html>
